<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zirconique</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05080f;color:#cbd5e1;font-family:'Space Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
  .logo{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:#f8fafc;letter-spacing:-0.04em;margin-bottom:6px}
  .logo span{color:#60a5fa}
  .sub{font-size:9px;letter-spacing:0.3em;color:#475569;text-transform:uppercase;margin-bottom:48px}
  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .card{width:260px;background:#0a0f1a;border:1px solid #1a2535;border-radius:12px;padding:28px 24px;text-decoration:none;color:inherit;transition:all 0.2s;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px}
  .card-stocks::after{background:#3b82f6}
  .card-tenders::after{background:#c9a84c}
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.4)}
  .card-icon{font-size:28px;margin-bottom:12px}
  .card-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:6px}
  .card-desc{font-size:10px;color:#475569;line-height:1.7;letter-spacing:0.04em}
  .card-arrow{position:absolute;top:24px;right:20px;font-size:18px;color:#1e3a5f;transition:all 0.2s}
  .card:hover .card-arrow{color:#60a5fa;transform:translateX(4px)}
  .footer{margin-top:48px;font-size:9px;letter-spacing:0.2em;color:#1e3a5f;text-transform:uppercase}
</style>
</head>
<body>
  <div class="logo">Zirco<span>nique</span></div>
  <div class="sub">Intelligence Platform</div>
  <div class="cards">
    <a href="/stocks/" class="card card-stocks">
      <div class="card-arrow">→</div>
      <div class="card-icon">📈</div>
      <div class="card-title">MarketIQ</div>
      <div class="card-desc">Global Stock Screener — High Conviction Recovery Plays. US · EU · India. Live prices.</div>
    </a>
    <a href="/tenders/" class="card card-tenders">
      <div class="card-arrow">→</div>
      <div class="card-icon">⚡</div>
      <div class="card-title">TenderIQ</div>
      <div class="card-desc">PSU Electrical Bid Intelligence — NTPC · UPPCL · Uttar Pradesh. L1/L2 analytics.</div>
    </a>
  </div>
  <div class="footer">© 2026 Zirconique · All rights reserved</div>
</body>
</html>
